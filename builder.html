<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Work test builder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2305545a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23fff' stroke-width='2.2'/%3E%3Cpath d='M16 10.5V16l3.6 2.6' stroke='%23fff' stroke-width='2.2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<style>
/* The builder deliberately does NOT share styles.css with the candidate pages. That stylesheet
   is tuned for one calm column on a slow connection and carries a dark mode; this is a dense
   authoring tool used on a laptop. Keeping them apart means neither is compromised for the
   other, and a change here can never alter what a candidate sees.

   No web font is fetched. The Content-Security-Policy in _headers allows no external anything,
   which is the right default for a public deployment, and the system stack is what the design
   this follows degrades to anyway. */
:root {
  color-scheme: light;
  --bg: #f8f8fa;
  --surface: #ffffff;
  --surface-2: #f1f3f5;
  --border: #e2e6ea;
  --border-strong: #c6ced6;
  --ink: #20253a;
  --muted: #5d6577;
  --faint: #939aab;
  --accent: #05545a;
  --accent-dark: #033f44;
  --accent-weak: #d5f4f7;
  --band: #eaf6f8;
  --green: #2f9e44;
  --amber: #f08c00;
  --red: #e03131;
  --radius: 8px;
  --radius-sm: 5px;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  --shadow-md: 0 1px 2px rgba(16,24,40,.05), 0 4px 12px rgba(16,24,40,.06);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.55 var(--font); }
h1, h2, h3 { margin: 0; }
p { margin: 0 0 0.7rem; }
code { font-family: var(--mono); font-size: 0.82em; }

/* ---------------------------------------------------------------- top bar --------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
  padding: 0.55rem 1.1rem; background: var(--surface); border-bottom: 1px solid var(--border);
}
.mark { font-size: 0.72rem; font-weight: 750; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink); }
.mark span { color: var(--faint); font-weight: 600; margin: 0 0.5rem; }
.mark em { font-style: normal; font-weight: 600; letter-spacing: 0; text-transform: none; font-size: 0.86rem; color: var(--muted); }
.steps { display: flex; gap: 0.2rem; }
.step {
  font: inherit; font-size: 0.83rem; border: 0; background: none; color: var(--muted);
  padding: 0.3rem 0.7rem; border-radius: var(--radius-sm); cursor: pointer;
}
.step:hover { background: var(--surface-2); color: var(--ink); }
.step.on { background: var(--band); color: var(--accent); font-weight: 620; }
.grow { flex: 1; }
.statusline { font-size: 0.78rem; color: var(--faint); }
.statusline.bad { color: var(--red); }

/* ---------------------------------------------------------------- buttons --------- */
.btn {
  font: inherit; font-size: 0.82rem; background: var(--surface); color: var(--ink);
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  padding: 0.32rem 0.7rem; cursor: pointer;
}
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:hover { background: var(--accent-dark); }
.btn.danger { color: var(--red); border-color: var(--border); }
.btn.tiny { padding: 0.15rem 0.4rem; font-size: 0.75rem; }
.btns { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }

/* ---------------------------------------------------------------- layout ---------- */
.page { max-width: 74rem; margin: 0 auto; padding: 1.4rem 1.1rem 4rem; }
.page.narrow { max-width: 46rem; }
.hero { text-align: center; margin-bottom: 1.6rem; }
.hero .eyebrow { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--faint); }
.hero h1 { font-size: 1.35rem; font-weight: 660; margin-top: 0.35rem; line-height: 1.3; }
.hero h1 b { color: var(--accent); font-weight: 660; }
.hero p { color: var(--muted); margin: 0.5rem auto 0; max-width: 34rem; }

.block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1rem 1.1rem; margin-bottom: 1rem; }
.block > h2 { font-size: 0.95rem; font-weight: 650; margin-bottom: 0.2rem; }
.block > .lede { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.9rem; }

/* ------------------------------------------------------------ option cards -------- */
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 0.6rem; }
.choice {
  display: block; border: 1px solid var(--border); border-radius: var(--radius);
  padding: 0.65rem 0.75rem; cursor: pointer; background: var(--surface); position: relative;
}
.choice:hover { border-color: var(--border-strong); }
.choice.on { border-color: var(--accent); background: var(--band); box-shadow: inset 0 0 0 1px var(--accent); }
.choice input { position: absolute; opacity: 0; pointer-events: none; }
.choice .t { font-weight: 640; font-size: 0.88rem; display: block; }
.choice .d { color: var(--muted); font-size: 0.8rem; display: block; margin-top: 0.15rem; }
.choice .warn { color: var(--amber); font-size: 0.78rem; display: block; margin-top: 0.35rem; font-weight: 600; }

/* ------------------------------------------------------------------ fields -------- */
.f { display: block; margin-bottom: 0.75rem; }
.f > .l { display: block; font-size: 0.78rem; font-weight: 640; color: var(--ink); margin-bottom: 0.25rem; }
.f > .h { display: block; font-size: 0.78rem; color: var(--muted); margin-top: 0.25rem; }
.f input[type=text], .f input[type=number], .f textarea, .f select {
  width: 100%; font: inherit; font-size: 0.86rem; padding: 0.4rem 0.5rem;
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  background: var(--surface); color: inherit;
}
.f input:focus, .f textarea:focus, .f select:focus { outline: 2px solid var(--accent-weak); border-color: var(--accent); }
.f textarea { resize: vertical; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; }
.inline { display: flex; align-items: center; gap: 0.45rem; margin-bottom: 0.5rem; font-size: 0.86rem; }

.sub { border: 1px solid var(--border); border-radius: var(--radius); padding: 0.7rem; margin-bottom: 0.6rem; background: var(--surface); }
.sub .head { display: flex; gap: 0.35rem; align-items: center; margin-bottom: 0.5rem; }
.sub .head .n { font-size: 0.72rem; font-weight: 700; color: var(--faint); text-transform: uppercase; letter-spacing: 0.05em; }

/* ------------------------------------------------------------- editor grid -------- */
.editor { display: grid; grid-template-columns: 14rem minmax(18rem, 1fr) minmax(20rem, 1.05fr); gap: 1rem; align-items: start; }
@media (max-width: 68rem) { .editor { grid-template-columns: 1fr; } }
.col { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 0.85rem; }
.col.sticky { position: sticky; top: 3.4rem; max-height: calc(100vh - 4.4rem); overflow: auto; }
.colhead { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); margin: 0 0 0.5rem; }
.colhead + .colhead { margin-top: 1rem; }

.item {
  display: flex; gap: 0.4rem; align-items: center; width: 100%; text-align: left;
  font: inherit; font-size: 0.83rem; background: none; border: 1px solid transparent;
  border-radius: var(--radius-sm); padding: 0.35rem 0.45rem; cursor: pointer; color: inherit;
}
.item:hover { background: var(--surface-2); }
.item.on { background: var(--band); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.item .txt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .bad { color: var(--red); font-weight: 800; }
.item .tag { font-size: 0.68rem; color: var(--faint); }

/* --------------------------------------------------------------- inspector -------- */
.tabs { display: flex; gap: 0.25rem; margin-bottom: 0.7rem; flex-wrap: wrap; }
.tab { font: inherit; font-size: 0.78rem; background: none; border: 1px solid var(--border); border-radius: 999px; padding: 0.2rem 0.65rem; cursor: pointer; color: var(--muted); }
.tab.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

.mapwrap { position: relative; overflow: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-2); }
.map { position: relative; display: flex; gap: 3.2rem; padding: 0.9rem 1.1rem; min-width: min-content; }
.mapcol { display: flex; flex-direction: column; gap: 0.9rem; min-width: 9rem; }
.mapcol > .h { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--faint); }
.node { position: relative; z-index: 2; width: 9rem; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); padding: 0.4rem 0.5rem; cursor: pointer; box-shadow: var(--shadow); }
.node:hover { border-color: var(--accent); }
.node.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.node .nid { font-family: var(--mono); font-size: 0.66rem; color: var(--faint); }
.node .npr { font-size: 0.74rem; line-height: 1.3; margin-top: 0.1rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.node .ntag { font-size: 0.63rem; color: var(--faint); margin-top: 0.2rem; }
.node.choice2 { border-left: 3px solid var(--amber); }
.node.end { border-left: 3px solid var(--green); }
.node.orphan { border-style: dashed; color: var(--faint); }
.node.missing { border-color: var(--red); color: var(--red); border-style: dashed; }
.map svg { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
.elabel { position: absolute; z-index: 3; font-size: 0.63rem; background: var(--surface-2); padding: 0 0.2rem; border-radius: 3px; color: var(--muted); pointer-events: none; max-width: 7.5rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.routes { margin-top: 0.7rem; font-size: 0.8rem; }
.routes ol { padding-left: 1.2rem; margin: 0.3rem 0 0; }
.routes code { font-size: 0.72rem; }

.prob { display: flex; gap: 0.45rem; font-size: 0.8rem; padding: 0.4rem 0; border-bottom: 1px solid var(--border); }
.prob:last-child { border-bottom: 0; }
.prob .lvl { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; padding-top: 0.15rem; }
.prob.error .lvl { color: var(--red); }
.prob.warning .lvl { color: var(--amber); }
.allgood { color: var(--green); font-weight: 620; font-size: 0.85rem; }

.pv { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); padding: 0.85rem; }
.pv h3 { font-size: 0.95rem; margin-bottom: 0.25rem; }
.pv .ctx { color: var(--muted); font-size: 0.82rem; }
.pv .brief { border-left: 2px solid var(--border); padding-left: 0.6rem; margin-bottom: 0.7rem; font-size: 0.8rem; color: var(--muted); }
.pv .brief figure { margin: 0.4rem 0; }
.pv .brief h4 { margin: 0.7rem 0 0.25rem; font-size: 0.82rem; color: var(--ink); }
.pv .brief ul { margin: 0.2rem 0 0.5rem; padding-left: 1.1rem; }
.pv .brief table { border-collapse: collapse; margin: 0.3rem 0 0.6rem; font-size: 0.76rem; }
.pv .brief th, .pv .brief td { text-align: left; vertical-align: top; padding: 0.15rem 0.45rem; border-bottom: 1px solid var(--border); }
.pv .brief p { white-space: pre-line; }
.pv .brief figcaption { font-weight: 640; color: var(--ink); font-size: 0.76rem; }
.pv .opt { display: block; width: 100%; text-align: left; margin-bottom: 0.3rem; }
.pv .fake { border: 1px dashed var(--border-strong); border-radius: var(--radius-sm); padding: 0.55rem; color: var(--muted); font-size: 0.8rem; margin-bottom: 0.6rem; }
.crumbs { font-size: 0.74rem; color: var(--faint); margin-bottom: 0.5rem; }

.live-frame { display: block; width: 100%; height: 70vh; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; }
textarea.json { width: 100%; min-height: 22rem; font-family: var(--mono); font-size: 0.72rem; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 0.5rem; background: var(--surface); color: inherit; }

.hint { font-size: 0.8rem; color: var(--muted); }
.callout { font-size: 0.82rem; border: 1px solid var(--border); border-left: 3px solid var(--amber); background: #fffaf2; border-radius: var(--radius-sm); padding: 0.6rem 0.75rem; margin-bottom: 0.9rem; }
.callout.info { border-left-color: var(--accent); background: var(--band); }
.callout strong { font-weight: 660; }
.ship code { display: block; background: var(--ink); color: #e9edf5; padding: 0.5rem 0.7rem; border-radius: var(--radius-sm); margin: 0.3rem 0; font-size: 0.76rem; overflow-x: auto; }
</style>
</head>
<body>

<header class="topbar">
  <span class="mark">2AI <span>/</span> <em>Work test builder</em></span>
  <nav class="steps" id="steps"></nav>
  <span class="grow"></span>
  <span class="statusline" id="status">Draft saved in this browser</span>
  <div class="btns">
    <button class="btn" id="load-example">Load an example</button>
    <button class="btn" id="import">Import</button>
    <button class="btn primary" id="download">Download spec</button>
  </div>
</header>

<div id="stage"></div>
<input type="file" id="file" accept="application/json,.json" hidden>

<script type="module">
/**
 * The authoring tool. A non-technical colleague builds a whole work test here, watches the routes
 * as they go, walks their own draft as a candidate would, and downloads one JSON file.
 *
 * Two decisions shape everything below.
 *
 * It validates with the SAME module the server runs, imported from assets/wt-flow.mjs. A second
 * copy of "where does this branch go" written for the browser would drift from the real one, and
 * the failure mode of that drift is the worst available: an author sees a flow marked valid and a
 * candidate walks into a dead end, on a clock, in a hiring assessment.
 *
 * It cannot publish. Downloading a spec and deploying it are separate acts, deliberately, because
 * this page has no authentication of any kind and the thing it would be publishing is a live
 * hiring assessment. `node tools/spec-apply.mjs <file>` turns a downloaded spec into the
 * committed questions file, so shipping is a reviewed diff rather than a button.
 *
 * The three steps are Setup, Questions and Review. Setup exists because the decisions in it are
 * the ones that quietly change what a test measures, and burying them in a settings panel is how
 * a test ends up letting candidates revise their answers because nobody noticed the default.
 */

import {
  validateFlow, currentQuestionId, questionById, outgoingIds, optionLabels, routesFrom,
} from './assets/wt-flow.mjs';

/* ------------------------------------------------------------------- state ---------- */

const LS_KEY = 'work-test-builder-draft';

const STARTER = () => ({
  durationSec: 5400,
  notes: '',
  timing: { mode: 'total' },
  navigation: { back: false, edit: false },
  integrity: { blockPaste: false },
  sections: [
    { id: 'part1', label: 'Part 1', summary: 'Analyse the data and write up', recommendedMin: 60 },
    { id: 'part2', label: 'Part 2', summary: 'Reply to your manager', recommendedMin: 30 },
  ],
  briefs: {
    setup: {
      section: 'Part 1 of 2',
      heading: 'The situation',
      blocks: [{ type: 'p', text: 'Describe the scenario the candidate is walking into.' }],
    },
  },
  questions: [
    { id: 'first_question', section: 'part1', brief: 'setup', type: 'rich', require: 'text', prompt: 'What do you recommend, and why?', maxLength: 1200 },
  ],
});

let spec = migrate(load()) || STARTER();
let step = 'setup';
let selected = firstId();
let tab = 'map';
let walk = [];

function firstId() { return spec.questions.length ? spec.questions[0].id : null; }

/** Fills in anything a spec written before these settings existed does not carry. */
function migrate(s) {
  if (!s || !Array.isArray(s.questions)) return null;
  s.timing = s.timing && ['total', 'section', 'none'].includes(s.timing.mode) ? s.timing : { mode: 'total' };
  s.navigation = { back: !!(s.navigation && s.navigation.back), edit: !!(s.navigation && s.navigation.edit) };
  s.integrity = { blockPaste: !!(s.integrity && s.integrity.blockPaste) };
  s.intro = s.intro && typeof s.intro === 'object' ? s.intro : {};
  s.outro = s.outro && typeof s.outro === 'object' ? s.outro : {};
  s.notes = typeof s.notes === 'string' ? s.notes : '';
  s.briefs = s.briefs && typeof s.briefs === 'object' ? s.briefs : {};
  s.sections = Array.isArray(s.sections) && s.sections.length ? s.sections : STARTER().sections;
  s.durationSec = Number(s.durationSec) > 0 ? Number(s.durationSec) : 5400;
  return s;
}

function load() {
  try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; } catch { return null; }
}

function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(spec)); note('Draft saved in this browser'); }
  catch { note('Cannot save in this browser. Download the spec before closing this tab.', true); }
}

function note(text, bad = false) {
  const n = $('#status');
  n.textContent = text;
  n.classList.toggle('bad', !!bad);
}

/* ------------------------------------------------------------------ helpers --------- */

const $ = (s, r = document) => r.querySelector(s);
const slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 40);

/** Builds an element. Text always goes in as text, never as markup. */
/** What each brief block type is called in the editor. Keep in step with renderBrief in app.js. */
const BLOCK_NAMES = { p: 'Paragraph', h: 'Subheading', list: 'Bullet list', table: 'Table', quote: 'Quoted message', link: 'Link to data' };

function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : String(v));
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined) n.append(kid);
  return n;
}

const field = (label, control, hint) => el('label', { class: 'f' },
  el('span', { class: 'l', text: label }), control, hint ? el('span', { class: 'h', text: hint }) : null);

function input(value, oninput, attrs = {}) {
  const i = el('input', { type: 'text', ...attrs });
  i.value = value == null ? '' : value;
  i.addEventListener('input', () => oninput(i.value));
  return i;
}

function area(value, oninput, rows = 3) {
  const t = el('textarea', { rows });
  t.value = value == null ? '' : value;
  t.addEventListener('input', () => oninput(t.value));
  return t;
}

function number(value, oninput, attrs = {}) {
  const i = el('input', { type: 'number', ...attrs });
  i.value = value == null ? '' : value;
  i.addEventListener('input', () => oninput(i.value === '' ? undefined : Number(i.value)));
  return i;
}

function select(choices, value, onchange) {
  const s = el('select');
  for (const [v, label] of choices) {
    const o = el('option', { value: v, text: label });
    if (v === value) o.selected = true;
    s.append(o);
  }
  s.addEventListener('change', () => onchange(s.value));
  return s;
}

function toggle(checked, onchange, label) {
  const box = el('input', { type: 'checkbox' });
  box.checked = !!checked;
  box.addEventListener('change', () => onchange(box.checked));
  return el('label', { class: 'inline' }, box, el('span', { text: label }));
}

/**
 * The card grid used for every either/or decision. One shape for all of them, so a setting that
 * changes what the test measures looks as important as it is rather than hiding in a dropdown.
 */
function cards(name, options, current, onpick) {
  const wrap = el('div', { class: 'choices' });
  for (const o of options) {
    const on = o.value === current;
    const box = el('input', { type: 'radio', name });
    box.checked = on;
    box.addEventListener('change', () => onpick(o.value));
    const card = el('label', { class: `choice ${on ? 'on' : ''}` },
      box,
      el('span', { class: 't', text: o.title }),
      el('span', { class: 'd', text: o.detail }),
      o.warn && on ? el('span', { class: 'warn', text: o.warn }) : null);
    wrap.append(card);
  }
  return wrap;
}

/* ---------------------------------------------------------------- mutation ---------- */

function touch({ redraw = false } = {}) {
  save();
  if (redraw) draw();
  else { drawInspector(); drawOutline(); }
}

function renameQuestion(oldId, newId) {
  if (!newId || newId === oldId) return;
  for (const q of spec.questions) {
    if (q.id === oldId) q.id = newId;
    if (q.next === oldId) q.next = newId;
    for (const o of q.options || []) if (o && typeof o === 'object' && o.next === oldId) o.next = newId;
  }
  if (selected === oldId) selected = newId;
}

function uniqueId(base) {
  let id = slug(base) || 'question';
  let n = 2;
  while (spec.questions.some((q) => q.id === id)) id = `${slug(base) || 'question'}_${n++}`;
  return id;
}

function addQuestion() {
  const id = uniqueId('new_question');
  spec.questions.push({ id, section: spec.sections[0]?.id || 'part1', type: 'rich', require: 'text', prompt: '', maxLength: 1200 });
  selected = id;
  walk = [];
  draw();
}

function deleteQuestion(id) {
  const pointing = spec.questions.filter((x) => x.id !== id
    && (x.next === id || (x.options || []).some((o) => o && typeof o === 'object' && o.next === id)));
  const msg = pointing.length
    ? `Delete "${id}"? ${pointing.length} branch${pointing.length === 1 ? '' : 'es'} point at it and will be left dangling, which the problems list will flag.`
    : `Delete "${id}"?`;
  if (!confirm(msg)) return;
  spec.questions = spec.questions.filter((x) => x.id !== id);
  if (selected === id) selected = firstId();
  walk = [];
  draw();
}

function moveQuestion(id, by) {
  const i = spec.questions.findIndex((q) => q.id === id);
  const j = i + by;
  if (i < 0 || j < 0 || j >= spec.questions.length) return;
  const [q] = spec.questions.splice(i, 1);
  spec.questions.splice(j, 0, q);
  walk = [];
  draw();
}

/* ------------------------------------------------------------------ routing --------- */

function draw() {
  drawSteps();
  const stage = $('#stage');
  stage.replaceChildren();
  if (step === 'setup') drawSetup(stage);
  else if (step === 'questions') drawQuestions(stage);
  else drawReview(stage);
  save();
}

function drawSteps() {
  const nav = $('#steps');
  nav.replaceChildren();
  const problems = review();
  const errors = problems.filter((p) => p.level === 'error').length;
  const labels = [
    ['setup', '1. Setup'],
    ['questions', `2. Questions (${spec.questions.length})`],
    ['review', errors ? `3. Review (${errors})` : '3. Review'],
  ];
  for (const [key, label] of labels) {
    nav.append(el('button', {
      class: `step ${step === key ? 'on' : ''}`,
      onclick: () => { step = key; draw(); },
      text: label,
    }));
  }
}

/* -------------------------------------------------------------------- setup --------- */

const TIMING = [
  { value: 'total', title: 'One clock for the whole test', detail: 'A single countdown that starts when they press begin and does not stop. What most timed tests want.' },
  { value: 'section', title: 'A clock for each part', detail: 'Each part gets its own limit. Running one out does not end the sitting: the rest of that part is marked as not reached and they move on to the next.' },
  { value: 'none', title: 'No time limit', detail: 'Untimed. No countdown is shown and nothing expires. Good for a take-home, and for trying the test out yourself.' },
];

const BACK_CHOICES = [
  { value: 'off', title: 'One question at a time, no going back', detail: 'Once they continue, that answer is final and the next question appears. This is the default and it is what the test currently promises candidates.' },
  { value: 'look', title: 'They can look back, but not change', detail: 'Earlier answers can be re-read, which helps when a later question refers to an earlier one. Nothing can be edited.' },
  {
    value: 'edit', title: 'They can go back and change answers', detail: 'Earlier answers can be replaced right up until the clock stops.',
    warn: 'This changes what the test measures. A forward-only test asks what their judgment is with what they have now; this one asks something else. If an edit changes a branch, every answer after it is discarded.',
  },
];

function drawSetup(stage) {
  const page = el('div', { class: 'page' });

  page.append(el('div', { class: 'hero' },
    el('div', { class: 'eyebrow', text: 'A 2AI tool' }),
    el('h1', {}, el('span', { text: 'Decide how the test behaves. ' }), el('b', { text: 'Then write the questions.' })),
    el('p', { text: 'Everything on this page applies to the whole test. These are the settings that quietly change what a work test measures, which is why they come first rather than hiding in a panel.' })));

  /* 1. Time */
  const timing = el('section', { class: 'block' },
    el('h2', { text: '1. How long do they get?' }),
    el('p', { class: 'lede', text: 'The clock runs on our server, so refreshing, closing the tab or opening the test on another device gives nobody more time.' }),
    cards('timing', TIMING, spec.timing.mode, (v) => { spec.timing.mode = v; draw(); }));

  if (spec.timing.mode === 'total') {
    timing.append(el('div', { style: 'margin-top:0.8rem;max-width:14rem' },
      field('Minutes for the whole test',

  }
  if (spec.timing.mode === 'section') {
    const grid = el('div', { class: 'row3', style: 'margin-top:0.8rem' });
    for (const s of spec.sections) {
      grid.append(field(`${s.label}: minutes`,
        number(s.limitMin, (v) => { s.limitMin = v; touch(); }, { min: 1, placeholder: 'no limit' }),
        'Leave blank for no limit on this part.'));
    }
    timing.append(grid);
    timing.append(el('p', { class: 'hint', text: 'A part with no limit is untimed, so a candidate could sit in it indefinitely. Set every part, or use one clock for the whole test.' }));
  }
  page.append(timing);

  /* 2. Navigation */
  const navMode = spec.navigation.edit ? 'edit' : spec.navigation.back ? 'look' : 'off';
  page.append(el('section', { class: 'block' },
    el('h2', { text: '2. Can they go back?' }),
    el('p', { class: 'lede', text: 'Not a presentation choice. Going back is currently an operation the server does not have, which is what makes "your answer is final" true rather than a promise the page makes.' }),
    cards('nav', BACK_CHOICES, navMode, (v) => {
      spec.navigation = { back: v !== 'off', edit: v === 'edit' };
      draw();
    })));

  /* 3. Copy and paste */
  page.append(el('section', { class: 'block' },
    el('h2', { text: '3. Copying and pasting' }),
    el('p', { class: 'lede', text: 'Every paste is counted and stored either way. Blocking is friction that changes behaviour at the margin, not evidence about who wrote an answer: it cannot tell an outside source from the candidate’s own spreadsheet, and devtools defeat it.' }),
    cards('paste', [
      { value: 'allow', title: 'Allow pasting', detail: 'What an AI-forward test should almost always do. Blocking contradicts telling candidates they may use AI and a spreadsheet.' },
      { value: 'block', title: 'Block pasting', detail: 'Refuses paste and drag-drop into answer boxes. A candidate pasting figures back from their own working is stopped just the same.' },
    ], spec.integrity.blockPaste ? 'block' : 'allow', (v) => { spec.integrity.blockPaste = v === 'block'; draw(); })));

  /* 4. Parts */
  const parts = el('section', { class: 'block' },
    el('h2', { text: '4. The parts' }),
    el('p', { class: 'lede', text: 'Recommended minutes decide how the progress bar is shared out, so a candidate can see which part is the bulk of the work rather than counting questions.' }));

  spec.sections.forEach((s, i) => {
    const box = el('div', { class: 'sub' });
    box.append(el('div', { class: 'head' },
      el('span', { class: 'n', text: `Part ${i + 1}` }),
      el('span', { class: 'grow' }),
      el('button', { class: 'btn tiny', text: '↑', onclick: () => { if (i > 0) { [spec.sections[i - 1], spec.sections[i]] = [spec.sections[i], spec.sections[i - 1]]; draw(); } } }),
      el('button', { class: 'btn tiny', text: '↓', onclick: () => { if (i < spec.sections.length - 1) { [spec.sections[i + 1], spec.sections[i]] = [spec.sections[i], spec.sections[i + 1]]; draw(); } } }),
      el('button', {
        class: 'btn tiny danger', text: 'Remove',
        onclick: () => {
          const used = spec.questions.filter((q) => q.section === s.id).length;
          if (used && !confirm(`${used} question${used === 1 ? '' : 's'} sit in "${s.label}". Remove it anyway? Those questions will fall back to the first part.`)) return;
          spec.sections.splice(i, 1);
          draw();
        },
      })));
    box.append(el('div', { class: 'row' },
      field('Label', input(s.label, (v) => { s.label = v; touch(); })),
      field('Recommended minutes', number(s.recommendedMin, (v) => { s.recommendedMin = Number(v) || 0; touch(); }, { min: 0 }))));
    box.append(field('Summary', input(s.summary, (v) => { s.summary = v; touch(); }), 'Shown under the progress bar, for example "Analyse the data and write up".'));
    box.append(field('Id', input(s.id, (v) => {
      const old = s.id;
      const next = slug(v) || old;
      s.id = next;
      for (const q of spec.questions) if (q.section === old) q.section = next;
      touch();
    }), 'Ties questions to this part. Changing it moves every question that was in it.'));
    parts.append(box);
  });
  parts.append(el('div', { class: 'btns' }, el('button', {
    class: 'btn', text: '+ Add a part',
    onclick: () => {
      spec.sections.push({ id: `part${spec.sections.length + 1}`, label: `Part ${spec.sections.length + 1}`, summary: '', recommendedMin: 30 });
      draw();
    },
  })));
  page.append(parts);

  /* 5. What candidates are told */
  const intro = spec.intro = spec.intro && typeof spec.intro === 'object' ? spec.intro : {};
  const told = el('section', { class: 'block' },
    el('h2', { text: '5. What candidates are told before they start' }),
    el('p', { class: 'lede', text: 'The rules about time, going back, pasting and files are written for you from the settings above, so they can never say something the test does not do. Everything here is what only you know: the task-specific rules and the prose around them.' }));

  told.append(field('Opening note (optional)', area(intro.blurb, (v) => { if (v) intro.blurb = v; else delete intro.blurb; touch(); }, 3),
    'Sits under the summary sentence, above the rules.'));

  told.append(el('p', { class: 'colhead', text: 'Your own rules' }));
  intro.rules = Array.isArray(intro.rules) ? intro.rules : [];
  intro.rules.forEach((r, i) => {
    if (typeof r === 'string') intro.rules[i] = { lead: '', text: r };
    const rule = intro.rules[i];
    const box = el('div', { class: 'sub' });
    box.append(el('div', { class: 'head' },
      el('span', { class: 'n', text: `Rule ${i + 1}` }),
      el('span', { class: 'grow' }),
      el('button', { class: 'btn tiny', text: '↑', onclick: () => { if (i > 0) { [intro.rules[i - 1], intro.rules[i]] = [intro.rules[i], intro.rules[i - 1]]; draw(); } } }),
      el('button', { class: 'btn tiny', text: '↓', onclick: () => { if (i < intro.rules.length - 1) { [intro.rules[i + 1], intro.rules[i]] = [intro.rules[i], intro.rules[i + 1]]; draw(); } } }),
      el('button', { class: 'btn tiny danger', text: '✕', onclick: () => { intro.rules.splice(i, 1); draw(); } })));
    box.append(field('The bold bit', input(rule.lead, (v) => { rule.lead = v; touch(); }), 'For example "Part 1 needs a spreadsheet."'));
    box.append(field('The rest', area(rule.text, (v) => { rule.text = v; touch(); }, 2)));
    told.append(box);
  });
  told.append(el('div', { class: 'btns' }, el('button', {
    class: 'btn', text: '+ Add a rule',
    onclick: () => { intro.rules.push({ lead: '', text: '' }); draw(); },
  })));

  told.append(el('p', { class: 'colhead', text: 'Prose after the rules' }));
  intro.sections = Array.isArray(intro.sections) ? intro.sections : [];
  intro.sections.forEach((s, i) => {
    const box = el('div', { class: 'sub' });
    box.append(el('div', { class: 'head' },
      el('span', { class: 'n', text: `Section ${i + 1}` }),
      el('span', { class: 'grow' }),
      el('button', { class: 'btn tiny', text: '↑', onclick: () => { if (i > 0) { [intro.sections[i - 1], intro.sections[i]] = [intro.sections[i], intro.sections[i - 1]]; draw(); } } }),
      el('button', { class: 'btn tiny', text: '↓', onclick: () => { if (i < intro.sections.length - 1) { [intro.sections[i + 1], intro.sections[i]] = [intro.sections[i], intro.sections[i + 1]]; draw(); } } }),
      el('button', { class: 'btn tiny danger', text: '✕', onclick: () => { intro.sections.splice(i, 1); draw(); } })));
    box.append(field('Heading', input(s.heading, (v) => { s.heading = v; touch(); })));
    box.append(field('Text', area(s.text, (v) => { s.text = v; touch(); }, 4), 'A blank line starts a new paragraph.'));
    told.append(box);
  });
  told.append(el('div', { class: 'btns' }, el('button', {
    class: 'btn', text: '+ Add a section',
    onclick: () => { intro.sections.push({ heading: '', text: '' }); draw(); },
  })));

  told.append(el('div', { class: 'row', style: 'margin-top:0.9rem' },
    field('Small print at the bottom (optional)', area(intro.closing, (v) => { if (v) intro.closing = v; else delete intro.closing; touch(); }, 3)),
    field('Contact address (optional)', input(intro.contactEmail, (v) => { if (v) intro.contactEmail = v; else delete intro.contactEmail; touch(); }),
      'Shown after the small print as a link they can click. Anything that is not an email address is ignored.')));

  const outro = spec.outro = spec.outro && typeof spec.outro === 'object' ? spec.outro : {};
  told.append(el('p', { class: 'colhead', text: 'After they submit' }));
  told.append(el('p', { class: 'hint', text: 'What they submitted, and whether they can still change it, is written for you. This is the part only you know: what happens next, and by when.' }));
  told.append(el('div', { class: 'row' },

    field('Contact address (optional)', input(outro.contactEmail, (v) => { if (v) outro.contactEmail = v; else delete outro.contactEmail; touch(); }))));

  page.append(told);

  /* 6. Notes */
  page.append(el('section', { class: 'block' },
    el('h2', { text: '6. Notes for whoever maintains this' }),
    el('p', { class: 'lede', text: 'Written into the header of the generated file, so it survives regeneration. Everything else in that file is overwritten.' }),
    field('Notes', area(spec.notes, (v) => { spec.notes = v; touch(); }, 4),
      'Where the task came from, what is deliberately ambiguous, anything the next person would otherwise guess at. Candidates never see this.')));

  page.append(el('div', { class: 'btns', style: 'justify-content:flex-end' },
    el('button', { class: 'btn primary', text: 'Next: write the questions →', onclick: () => { step = 'questions'; draw(); } })));

  stage.append(page);
}

/* ---------------------------------------------------------------- questions -------- */

function drawQuestions(stage) {
  const page = el('div', { class: 'page' });
  const grid = el('div', { class: 'editor' },
    el('nav', { class: 'col', id: 'outline' }),
    el('main', { class: 'col', id: 'detail' }),
    el('aside', { class: 'col sticky', id: 'inspector' }));
  page.append(grid);
  stage.append(page);
  drawOutline();
  drawDetail();
  drawInspector();
}

function drawOutline() {
  const root = $('#outline');
  if (!root) return;
  const bad = new Set(review().filter((p) => p.level === 'error' && p.id).map((p) => p.id));
  root.replaceChildren();

  root.append(el('p', { class: 'colhead', text: 'Reference material' }));
  root.append(el('button', {
    class: `item ${selected === 'briefs' ? 'on' : ''}`,
    onclick: () => { selected = 'briefs'; drawOutline(); drawDetail(); },
  }, el('span', { class: 'txt', text: 'Scenario briefs' })));

  root.append(el('p', { class: 'colhead', text: `Questions (${spec.questions.length})` }));
  for (const q of spec.questions) {
    const branches = (q.options || []).filter((o) => o && typeof o === 'object' && o.next !== undefined).length;
    root.append(el('button', {
      class: `item ${selected === q.id ? 'on' : ''}`,
      onclick: () => { selected = q.id; drawOutline(); drawDetail(); },
    },
      bad.has(q.id) ? el('span', { class: 'bad', text: '!' }) : null,
      el('span', { class: 'txt', text: q.prompt || '(no question text yet)' }),
      branches ? el('span', { class: 'tag', text: `⑂${branches}` }) : null));
  }
  root.append(el('div', { class: 'btns', style: 'margin-top:0.6rem' },
    el('button', { class: 'btn', text: '+ Add question', onclick: addQuestion })));
}

const TYPES = [
  ['rich', 'Formatted writing (headings, bold, lists)'],
  ['long', 'Plain long answer'],
  ['short', 'Single line'],
  ['choice', 'Multiple choice (this is how you branch)'],
];

const REQUIRE = [
  { value: 'text', title: 'Written answer', detail: 'They type their answer. No file.' },
  { value: 'file', title: 'A file', detail: 'They attach a PDF or Word document. No writing needed.' },
  { value: 'either', title: 'Writing or a file', detail: 'Whichever suits them, and one is enough. Good when you want the thinking and do not care about the medium.' },
  { value: 'both', title: 'A file and a written answer', detail: 'They attach a file and describe it, so a reviewer knows what they are opening.' },
  { value: 'optional', title: 'Nothing required', detail: 'They can continue without answering.' },
];

const FILE_KINDS = [['pdf', 'PDF'], ['docx', 'Word document (.docx)']];

function drawDetail() {
  const root = $('#detail');
  if (!root) return;
  root.replaceChildren();
  if (selected === 'briefs') return drawBriefs(root);
  const q = spec.questions.find((x) => x.id === selected);
  if (!q) return root.append(el('p', { class: 'hint', text: 'Pick a question on the left, or add one.' }));
  drawQuestionEditor(root, q);
}

function drawQuestionEditor(root, q) {
  const i = spec.questions.indexOf(q);
  root.append(el('div', { class: 'btns', style: 'margin-bottom:0.8rem' },
    el('span', { class: 'colhead', style: 'margin:0;flex:1', text: `Question ${i + 1} of ${spec.questions.length}` }),
    el('button', { class: 'btn tiny', text: '↑', onclick: () => moveQuestion(q.id, -1) }),
    el('button', { class: 'btn tiny', text: '↓', onclick: () => moveQuestion(q.id, 1) }),
    el('button', { class: 'btn tiny danger', text: 'Delete', onclick: () => deleteQuestion(q.id) })));

  root.append(field('The question', area(q.prompt, (v) => { q.prompt = v; touch(); }, 2)));
  root.append(field('Extra guidance (optional)', area(q.context, (v) => { if (v) q.context = v; else delete q.context; touch(); }, 2),
    'Sits under the question in smaller text. Good for saying what a complete answer covers.'));

  root.append(el('div', { class: 'row' },
    field('Answer type', select(TYPES, q.type, (v) => {
      q.type = v;
      if (v === 'choice' && !Array.isArray(q.options)) q.options = [{ label: 'First option' }, { label: 'Second option' }];
      if (v !== 'choice') delete q.options;
      if (v === 'choice') q.require = 'text';
      drawDetail(); touch();
    })),
    field('Which part', select(spec.sections.map((s) => [s.id, s.label]), q.section, (v) => { q.section = v; touch(); }))));

  root.append(el('div', { class: 'row' },
    field('Reference brief', select([['', 'None'], ...Object.keys(spec.briefs).map((k) => [k, k])], q.brief || '', (v) => {
      if (v) q.brief = v; else delete q.brief;
      touch();
    })),
    q.type === 'choice' ? el('span') : field('Character limit', number(q.maxLength, (v) => { q.maxLength = v; touch(); }, { min: 50 }))));

  if (q.type !== 'choice') {
    root.append(el('p', { class: 'colhead', style: 'margin-top:1rem', text: 'What must they give you?' }));
    root.append(cards(`req-${q.id}`, REQUIRE, q.require || 'text', (v) => { q.require = v; drawDetail(); touch(); }));

    if (['file', 'either', 'both'].includes(q.require)) {
      root.append(el('div', { style: 'margin-top:0.7rem' }));
      q.accept = Array.isArray(q.accept) && q.accept.length ? q.accept : ['pdf', 'docx'];
      for (const [kind, label] of FILE_KINDS) {
        root.append(toggle(q.accept.includes(kind), (on) => {
          const set = new Set(q.accept);
          if (on) set.add(kind); else set.delete(kind);
          q.accept = set.size ? [...set] : [kind];
          drawDetail(); touch();
        }, `Accept ${label}`));
      }
      root.append(el('p', { class: 'hint', text: 'A PDF is checked properly, byte by byte, so a file renamed to .pdf is refused. A .docx can only be checked as far as "a zip archive named .docx", because proving it is a real Word document means opening the archive. Files are capped at 4.5 MB.' }));
    }

    root.append(field('Placeholder text (optional)', input(q.placeholder, (v) => { if (v) q.placeholder = v; else delete q.placeholder; touch(); })));
  }

  if (!spec.integrity.blockPaste || q.blockPaste !== undefined) {
    root.append(toggle(q.blockPaste === true, (on) => {
      if (on) q.blockPaste = true; else delete q.blockPaste;
      touch();
    }, 'Block pasting on this question only'));
  }

  root.append(el('p', { class: 'colhead', style: 'margin-top:1rem', text: 'Where this leads' }));

  if (q.type === 'choice') {
    root.append(el('p', { class: 'hint', text: 'Each option can send the candidate somewhere different. They never see where an option leads, only its wording.' }));
    q.options = q.options || [];
    q.options.forEach((raw, oi) => {
      if (typeof raw === 'string') q.options[oi] = { label: raw };
      const o = q.options[oi];
      const box = el('div', { class: 'sub' });
      box.append(el('div', { class: 'head' },
        el('span', { class: 'n', text: `Option ${oi + 1}` }),
        el('span', { class: 'grow' }),
        el('button', { class: 'btn tiny', text: '↑', onclick: () => { if (oi > 0) { [q.options[oi - 1], q.options[oi]] = [q.options[oi], q.options[oi - 1]]; drawDetail(); touch(); } } }),
        el('button', { class: 'btn tiny', text: '↓', onclick: () => { if (oi < q.options.length - 1) { [q.options[oi + 1], q.options[oi]] = [q.options[oi], q.options[oi + 1]]; drawDetail(); touch(); } } }),
        el('button', { class: 'btn tiny danger', text: '✕', onclick: () => { q.options.splice(oi, 1); drawDetail(); touch(); } })));
      box.append(field('What the candidate sees', input(o.label, (v) => { o.label = v; touch(); })));
      box.append(field('Then go to', destSelect(o.next, (v) => { setDest(o, 'next', v); drawDetail(); touch(); })));
      root.append(box);
    });
    root.append(el('div', { class: 'btns' },
      el('button', { class: 'btn', text: '+ Add option', onclick: () => { q.options.push({ label: '' }); drawDetail(); touch(); } })));
    root.append(field('If an option has no destination of its own', destSelect(q.next, (v) => { setDest(q, 'next', v); drawDetail(); touch(); })));
  } else {
    root.append(field('After this question', destSelect(q.next, (v) => { setDest(q, 'next', v); drawDetail(); touch(); })));
  }
}

const DEST_FALL = ' fall';
const DEST_END = ' end';

function destSelect(current, onchange) {
  const choices = [
    [DEST_FALL, 'Continue to the next question in the list'],
    [DEST_END, 'End the test here'],
    ...spec.questions.map((q) => [q.id, `Go to: ${q.id}`]),
  ];
  const value = current === undefined ? DEST_FALL : current === null ? DEST_END : current;
  if (typeof current === 'string' && !spec.questions.some((q) => q.id === current)) {
    choices.push([current, `Missing: ${current}`]);
  }
  return select(choices, value, (v) => onchange(v === DEST_FALL ? undefined : v === DEST_END ? null : v));
}

function setDest(target, key, value) {
  if (value === undefined) delete target[key];
  else target[key] = value;
}

function drawBriefs(root) {
  root.append(el('p', { class: 'colhead', text: 'Scenario briefs' }));
  root.append(el('p', { class: 'hint', text: 'A brief is the reference material that stays on screen for every question that uses it: the scenario, a Slack message, an email, a link to the data.' }));

  for (const [key, brief] of Object.entries(spec.briefs)) {
    const box = el('div', { class: 'sub' });
    box.append(el('div', { class: 'head' },
      el('span', { class: 'n', text: key }),
      el('span', { class: 'grow' }),
      el('button', {
        class: 'btn tiny danger', text: 'Remove',
        onclick: () => {
          const used = spec.questions.filter((q) => q.brief === key).length;
          if (used && !confirm(`${used} question${used === 1 ? '' : 's'} use this brief and will lose it. Remove anyway?`)) return;
          delete spec.briefs[key];
          for (const q of spec.questions) if (q.brief === key) delete q.brief;
          drawDetail(); touch();
        },
      })));
    box.append(el('div', { class: 'row' },
      field('Eyebrow', input(brief.section, (v) => { brief.section = v; touch(); }), 'For example "Part 1 of 3".'),
      field('Heading', input(brief.heading, (v) => { brief.heading = v; touch(); }))));

    brief.blocks = brief.blocks || [];
    brief.blocks.forEach((b, bi) => {
      const bb = el('div', { class: 'sub' });
      bb.append(el('div', { class: 'head' },
        el('span', { class: 'n', text: BLOCK_NAMES[b.type] || 'Link to data' }),
        el('span', { class: 'grow' }),
        el('button', { class: 'btn tiny', text: '↑', onclick: () => { if (bi > 0) { [brief.blocks[bi - 1], brief.blocks[bi]] = [brief.blocks[bi], brief.blocks[bi - 1]]; drawDetail(); touch(); } } }),
        el('button', { class: 'btn tiny', text: '↓', onclick: () => { if (bi < brief.blocks.length - 1) { [brief.blocks[bi + 1], brief.blocks[bi]] = [brief.blocks[bi], brief.blocks[bi + 1]]; drawDetail(); touch(); } } }),
        el('button', { class: 'btn tiny danger', text: '✕', onclick: () => { brief.blocks.splice(bi, 1); drawDetail(); touch(); } })));

      if (b.type === 'p') bb.append(field('Text', area(b.text, (v) => { b.text = v; touch(); }, 3)));
      else if (b.type === 'h') bb.append(field('Subheading', input(b.text, (v) => { b.text = v; touch(); })));
      else if (b.type === 'list') {
        bb.append(field('Bullet points, one per line', area((b.items || []).join('\n'), (v) => {
          b.items = v.split('\n').map((x) => x.trim()).filter(Boolean);
          touch();
        }, 4)));
      } else if (b.type === 'table') {
        // One row per line, cells separated by a pipe. The first line is the header row.
        const toText = () => [b.head || [], ...(b.rows || [])].map((r) => r.join(' | ')).join('\n');
        bb.append(field('Rows, one per line, cells separated by |. The first line is the header.', area(toText(), (v) => {
          const rows = v.split('\n').filter((line) => line.trim()).map((line) => line.split('|').map((c) => c.trim()));
          b.head = rows.shift() || [];
          b.rows = rows;
          touch();
        }, 5)));
      } else if (b.type === 'quote') {
        bb.append(field('Who and when', input(b.label, (v) => { b.label = v; touch(); }), 'For example "Slack from your manager, 9:05am".'));
        bb.append(field('Message', area(b.text, (v) => { b.text = v; touch(); }, 4)));
        bb.append(field('Numbered points, one per line (optional)', area((b.list || []).join('\n'), (v) => {
          const lines = v.split('\n').map((x) => x.trim()).filter(Boolean);
          if (lines.length) b.list = lines; else delete b.list;
          touch();
        }, 3)));
        bb.append(field('Closing line (optional)', input(b.after, (v) => { if (v) b.after = v; else delete b.after; touch(); })));
      } else {
        bb.append(field('Button text', input(b.label, (v) => { b.label = v; touch(); })));
        bb.append(field('URL', input(b.url, (v) => { b.url = v; touch(); }),
          'Must start with https://. This becomes a real link on the candidate page, which is why anything else is refused.'));
      }
      box.append(bb);
    });

    box.append(el('div', { class: 'btns' },
      el('button', { class: 'btn tiny', text: '+ Paragraph', onclick: () => { brief.blocks.push({ type: 'p', text: '' }); drawDetail(); touch(); } }),
      el('button', { class: 'btn tiny', text: '+ Subheading', onclick: () => { brief.blocks.push({ type: 'h', text: '' }); drawDetail(); touch(); } }),
      el('button', { class: 'btn tiny', text: '+ Bullet list', onclick: () => { brief.blocks.push({ type: 'list', items: [] }); drawDetail(); touch(); } }),
      el('button', { class: 'btn tiny', text: '+ Table', onclick: () => { brief.blocks.push({ type: 'table', head: ['Column', 'Column'], rows: [['', '']] }); drawDetail(); touch(); } }),
      el('button', { class: 'btn tiny', text: '+ Quoted message', onclick: () => { brief.blocks.push({ type: 'quote', label: '', text: '' }); drawDetail(); touch(); } }),
      el('button', { class: 'btn tiny', text: '+ Link to data', onclick: () => { brief.blocks.push({ type: 'link', label: 'Open the data', url: 'https://' }); drawDetail(); touch(); } })));
    root.append(box);
  }

  root.append(el('div', { class: 'btns' }, el('button', {
    class: 'btn', text: '+ Add a brief',
    onclick: () => {
      let key = 'brief';
      let n = 2;
      while (spec.briefs[key]) key = `brief${n++}`;
      spec.briefs[key] = { section: '', heading: '', blocks: [] };
      drawDetail(); touch();
    },
  })));
}

/* ---------------------------------------------------------------- inspector -------- */

function drawInspector() {
  const root = $('#inspector');
  if (!root) return;
  root.replaceChildren();
  const problems = review();
  const errors = problems.filter((p) => p.level === 'error').length;

  const tabs = el('div', { class: 'tabs' });
  for (const [key, label] of [['map', 'Branch map'], ['walk', 'Walk it through'], ['live', 'Live preview'], ['problems', `Problems${problems.length ? ` ${problems.length}` : ''}`]]) {
    tabs.append(el('button', { class: `tab ${tab === key ? 'on' : ''}`, onclick: () => { tab = key; drawInspector(); }, text: label }));
  }
  root.append(tabs);

  if (errors && tab !== 'problems') {
    root.append(el('div', { class: 'callout' },
      el('strong', { text: `${errors} problem${errors === 1 ? '' : 's'} to fix. ` }),
      el('span', { text: 'This spec will not run until they are resolved.' })));
  }

  if (tab === 'map') drawMap(root);
  else if (tab === 'walk') drawWalk(root);
  else if (tab === 'live') drawLive(root, problems);
  else drawProblems(root, problems);
}

/**
 * How many routes there are and how long they run. Says "all 4 questions long" when every route
 * is the same length, because "4 to 4" is the kind of small wrongness that makes a tool feel
 * unfinished, and an author reading it twice to check is an author who trusts it less.
 */
function routeSummary(count, lengths) {
  const lo = Math.min(...lengths);
  const hi = Math.max(...lengths);
  return lo === hi
    ? `${count} possible routes, all ${lo} questions long.`
    : `${count} possible routes, ${lo} to ${hi} questions long.`;
}

function drawMap(root) {
  if (!spec.questions.length) return root.append(el('p', { class: 'hint', text: 'No questions yet.' }));

  const depth = new Map();
  const setDepth = (id, d) => {
    if (id == null || d > spec.questions.length + 1) return;
    const q = questionById(id, spec.questions);
    if (!q) return;
    if ((depth.get(id) ?? -1) >= d) return;
    depth.set(id, d);
    for (const n of outgoingIds(q, spec.questions)) setDepth(n, d + 1);
  };
  setDepth(spec.questions[0].id, 0);

  const maxDepth = Math.max(0, ...depth.values());
  const columns = [];
  for (let d = 0; d <= maxDepth; d++) columns.push(spec.questions.filter((q) => depth.get(q.id) === d));
  const orphans = spec.questions.filter((q) => !depth.has(q.id));
  const missing = new Set();
  for (const q of spec.questions) {
    for (const n of outgoingIds(q, spec.questions)) {
      if (n != null && !spec.questions.some((x) => x.id === n)) missing.add(n);
    }
  }

  const wrap = el('div', { class: 'mapwrap' });
  const map = el('div', { class: 'map' });
  const nodes = new Map();

  const nodeFor = (q, extra = '') => {
    const ends = outgoingIds(q, spec.questions).every((n) => n == null);
    const n = el('div', {
      class: `node ${q.type === 'choice' ? 'choice2' : ''} ${ends ? 'end' : ''} ${extra} ${selected === q.id ? 'on' : ''}`,
      onclick: () => { selected = q.id; drawOutline(); drawDetail(); drawInspector(); },
    },
      el('div', { class: 'nid', text: q.id }),
      el('div', { class: 'npr', text: q.prompt || '(no question text yet)' }),
      el('div', { class: 'ntag', text: ends ? 'ends the test' : q.type === 'choice' ? `${(q.options || []).length} options` : '' }));
    nodes.set(q.id, n);
    return n;
  };

  columns.forEach((col, d) => {
    const c = el('div', { class: 'mapcol' }, el('div', { class: 'h', text: `Step ${d + 1}` }));
    for (const q of col) c.append(nodeFor(q));
    map.append(c);
  });

  if (missing.size || orphans.length) {
    const c = el('div', { class: 'mapcol' }, el('div', { class: 'h', text: 'Not on any route' }));
    for (const q of orphans) c.append(nodeFor(q, 'orphan'));
    for (const id of missing) {
      const n = el('div', { class: 'node missing' },
        el('div', { class: 'nid', text: id }),
        el('div', { class: 'npr', text: 'This question does not exist' }));
      nodes.set(`missing:${id}`, n);
      c.append(n);
    }
    map.append(c);
  }

  wrap.append(map);
  root.append(wrap);

  // Measured synchronously, and deliberately NOT in requestAnimationFrame: that callback does
  // not fire while a page is hidden, so opening the builder in a background tab produced a map
  // with nodes and no edges at all.
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  map.append(svg);
  drawEdges(map, svg, nodes);

  const { routes, truncated } = routesFrom(spec.questions[0].id, spec.questions, []);
  const lengths = routes.map((r) => r.length);
  const box = el('div', { class: 'routes' });
  box.append(el('strong', {
    text: routes.length === 1
      ? 'One route through this test.'
      : routeSummary(routes.length, lengths),
  }));
  if (routes.length > 1 && new Set(lengths).size > 1) {
    box.append(el('p', { class: 'hint', text: 'Because the routes differ in length, candidates see "Question 3" rather than "Question 3 of 6". Make every route the same length if you want the count back.' }));
  }
  if (truncated) box.append(el('p', { class: 'hint', text: 'Too many routes to list them all.' }));
  const ol = el('ol');
  for (const r of routes.slice(0, 12)) ol.append(el('li', {}, el('code', { text: r.join(' → ') || '(empty)' })));
  box.append(ol);
  root.append(box);
}

function drawEdges(map, svg, nodes) {
  const base = map.getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${map.scrollWidth} ${map.scrollHeight}`);
  svg.setAttribute('width', map.scrollWidth);
  svg.setAttribute('height', map.scrollHeight);
  for (const stale of map.querySelectorAll('.elabel')) stale.remove();

  const at = (node) => {
    const r = node.getBoundingClientRect();
    return {
      x1: r.left - base.left + map.scrollLeft, x2: r.right - base.left + map.scrollLeft,
      y: r.top - base.top + map.scrollTop + r.height / 2,
    };
  };

  for (const q of spec.questions) {
    const from = nodes.get(q.id);
    if (!from) continue;
    const labels = optionLabels(q) || [];
    const edges = [];
    if (q.type === 'choice' && Array.isArray(q.options) && q.options.length) {
      q.options.forEach((o, i) => {
        const dest = o && typeof o === 'object' && o.next !== undefined
          ? o.next
          : outgoingIds({ ...q, options: [] }, spec.questions)[0];
        edges.push({ dest, label: labels[i] || `Option ${i + 1}` });
      });
    } else {
      edges.push({ dest: outgoingIds(q, spec.questions)[0], label: '' });
    }

    for (const { dest, label } of edges) {
      if (dest == null) continue;
      const to = nodes.get(dest) || nodes.get(`missing:${dest}`);
      if (!to) continue;
      const a = at(from);
      const b = at(to);
      const bad = !spec.questions.some((x) => x.id === dest);
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      const mid = (a.x2 + b.x1) / 2;
      path.setAttribute('d', `M ${a.x2} ${a.y} C ${mid} ${a.y}, ${mid} ${b.y}, ${b.x1} ${b.y}`);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', bad ? 'var(--red)' : 'var(--border-strong)');
      path.setAttribute('stroke-width', '1.5');
      if (bad) path.setAttribute('stroke-dasharray', '4 3');
      svg.append(path);

      if (label) {
        map.append(el('div', {
          class: 'elabel',
          style: `left:${mid - 38}px; top:${(a.y + b.y) / 2 - 8}px`,
          title: label,
          text: label.length > 20 ? `${label.slice(0, 19)}…` : label,
        }));
      }
    }
  }
}

function drawWalk(root) {
  const cur = currentQuestionId(walk, spec.questions);
  root.append(el('p', { class: 'hint', text: 'Click through your own test the way a candidate would, using the same routing code the server runs. Nothing here is timed or saved.' }));
  if (walk.length) root.append(el('div', { class: 'crumbs', text: `Route so far: ${walk.map((a) => a.id).join(' → ')}` }));

  const card = el('div', { class: 'pv' });
  if (!cur) {
    card.append(el('h3', { text: walk.length ? 'The test ends here' : 'There are no questions yet' }));
    if (walk.length) card.append(el('p', { class: 'ctx', text: `This route was ${walk.length} question${walk.length === 1 ? '' : 's'} long.` }));
  } else {
    const q = questionById(cur, spec.questions);
    const brief = q.brief ? spec.briefs[q.brief] : null;
    if (brief) {
      const b = el('div', { class: 'brief' });
      if (brief.heading) b.append(el('strong', { text: brief.heading }));
      for (const block of brief.blocks || []) {
        if (block.type === 'p') b.append(el('p', { text: block.text }));
        else if (block.type === 'h') b.append(el('h4', { text: block.text }));
        else if (block.type === 'list') { const ul = el('ul'); for (const it of block.items || []) ul.append(el('li', { text: it })); b.append(ul); }
        else if (block.type === 'table') {
          const t = el('table');
          if (block.head && block.head.length) { const tr = el('tr'); for (const c of block.head) tr.append(el('th', { text: c })); t.append(tr); }
          for (const row of block.rows || []) { const tr = el('tr'); for (const c of row) tr.append(el('td', { text: c })); t.append(tr); }
          b.append(t);
        } else if (block.type === 'quote') {
          const fig = el('figure');
          if (block.label) fig.append(el('figcaption', { text: block.label }));
          fig.append(el('p', { text: block.text }));
          if (block.list) { const ol = el('ol'); for (const it of block.list) ol.append(el('li', { text: it })); fig.append(ol); }
          if (block.after) fig.append(el('p', { text: block.after }));
          b.append(fig);
        } else b.append(el('p', {}, el('em', { text: `[link button: ${block.label || block.url}]` })));
      }
      card.append(b);
    }

    card.append(el('h3', { text: q.prompt || '(no question text yet)' }));
    if (q.context) card.append(el('p', { class: 'ctx', text: q.context }));

    if (q.type === 'choice') {
      (optionLabels(q) || []).forEach((label, i) => {
        card.append(el('button', {
          class: 'btn opt',
          onclick: () => { walk.push({ id: cur, value: label, choiceIndex: i }); drawInspector(); },
          text: label || `(option ${i + 1} has no wording)`,
        }));
      });
    } else {
      const req = q.require || 'text';
      const bits = [];
      if (req !== 'file') bits.push(req === 'optional' ? 'an optional answer box' : 'an answer box');
      if (['file', 'either', 'both'].includes(req)) bits.push(`a file upload (${(q.accept || ['pdf', 'docx']).join(' or ')}, up to 4.5 MB)`);
      card.append(el('div', { class: 'fake', text: `[${bits.join(' and ')}${req === 'either' ? ', either one is enough' : ''}]` }));
      card.append(el('button', {
        class: 'btn primary',
        onclick: () => { walk.push({ id: cur, value: 'preview' }); drawInspector(); },
        text: 'Continue',
      }));
    }
  }
  root.append(card);
  root.append(el('div', { class: 'btns', style: 'margin-top:0.6rem' },
    el('button', { class: 'btn', text: 'Start again', onclick: () => { walk = []; drawInspector(); } })));
}

/* --------------------------------------------------------------- live preview ------- */

/**
 * The real candidate page, running this draft, in a frame.
 *
 * "Walk it through" is a simulation of the candidate screen drawn by this page, which means the
 * two can drift: a rule the engine enforces that this page forgot to mention, a field the real
 * page draws differently. This tab removes the gap by loading the actual page. It needs the local
 * dev server, which accepts a draft at /api/dev-spec; the deployed site has no such endpoint, on
 * purpose, so this tab explains itself there rather than doing anything.
 */
let liveFrameKey = 0;

function drawLive(root, problems) {
  const errors = problems.filter((p) => p.level === 'error').length;
  const box = el('div');
  root.append(box);

  const status = el('p', { class: 'hint', text: 'Checking for the local dev server…' });
  box.append(status);

  fetch('/api/dev-spec', { method: 'GET' })
    .then((r) => (r.ok ? r.json() : null))
    .catch(() => null)
    .then((info) => {
      if (!info || !info.live) {
        status.replaceWith(el('div', { class: 'callout' },
          el('strong', { text: 'Live preview needs the local dev server. ' }),
          el('span', { text: 'Run ' }),
          el('code', { text: 'node tools/dev-server.mjs' }),
          el('span', { text: ' and open the builder from http://localhost:8788/builder.html. On the deployed site this tab does nothing, deliberately: nothing there can swap the running test.' })));
        return;
      }

      status.textContent = info.source === 'builder'
        ? `The preview is running a draft from this builder (${info.questions} questions).`
        : `The server is running the ${info.source === 'file' ? 'spec it was started with' : 'compiled test'} (${info.questions} questions), not this draft yet.`;

      const load = el('button', {
        class: 'btn primary',
        text: 'Load this draft into the preview',
        disabled: errors > 0,
        onclick: async () => {
          load.disabled = true;
          load.textContent = 'Loading…';
          let res;
          try {
            res = await fetch('/api/dev-spec', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ spec: JSON.parse(specJson()), reset: true }),
            }).then((r) => r.json());
          } catch {
            res = { ok: false, problems: [{ level: 'error', message: 'Could not reach the dev server.' }] };
          }
          load.disabled = false;
          load.textContent = 'Load this draft into the preview';
          if (!res.ok) {
            status.textContent = `The server refused the draft: ${(res.problems || []).map((p) => p.message).join(' ')}`;
            return;
          }
          // The frame shares this origin's storage with the builder, so a previous preview session
          // would otherwise be resumed. A fresh preview means a fresh candidate.
          try { localStorage.removeItem('work-test-token'); } catch { /* fine */ }
          status.textContent = `The preview is running this draft (${res.questions} questions). Use any made-up name and email.`;
          frame.src = `/?preview=${++liveFrameKey}`;
        },
      });

      const row = el('div', { class: 'btns', style: 'margin:0.6rem 0' }, load,
        el('button', { class: 'btn', text: 'Open in a new tab', onclick: () => window.open('/', '_blank', 'noopener') }));
      if (errors) row.append(el('span', { class: 'hint', text: 'Fix the problems first; the server refuses a flow with errors.' }));
      box.append(row);

      const frame = el('iframe', { class: 'live-frame', title: 'The candidate page, running this draft', src: 'about:blank' });
      box.append(frame);
      box.append(el('p', { class: 'hint', style: 'margin-top:0.5rem', text: 'This replaces whatever the dev server was running until it is restarted, and clears its practice sessions. It is the real page: the clock, the branching and the file checks are all live.' }));
    });
}

/* ----------------------------------------------------------------- problems -------- */

function review() {
  const problems = validateFlow(spec.questions).map((p) => ({ ...p }));

  for (const q of spec.questions) {
    if (!q.prompt || !q.prompt.trim()) problems.push({ level: 'error', id: q.id, message: `"${q.id}" has no question text.` });
    if (q.type === 'choice') {
      (q.options || []).forEach((o, i) => {
        const label = typeof o === 'string' ? o : (o && o.label) || '';
        if (!label.trim()) problems.push({ level: 'error', id: q.id, message: `Option ${i + 1} of "${q.id}" has no wording.` });
      });
    }
    if (q.section && !spec.sections.some((s) => s.id === q.section)) {
      problems.push({ level: 'warning', id: q.id, message: `"${q.id}" is in part "${q.section}", which no longer exists.` });
    }
  }

  for (const [key, brief] of Object.entries(spec.briefs)) {
    for (const b of brief.blocks || []) {
      if (!BLOCK_NAMES[b.type]) {
        problems.push({ level: 'error', message: `Brief "${key}" has a block of unknown type "${b.type}".` });
      }
      if (b.type === 'link' && !/^https?:\/\/\S+$/i.test(b.url || '')) {
        problems.push({ level: 'error', message: `The link in brief "${key}" must be a full https:// address.` });
      }
    }
  }

  const used = new Set(spec.questions.map((q) => q.section));
  for (const s of spec.sections) {
    if (!used.has(s.id)) problems.push({ level: 'warning', message: `Part "${s.label}" has no questions in it.` });
  }

  if (spec.timing.mode === 'section') {
    for (const s of spec.sections) {
      if (!(Number(s.limitMin) > 0) && used.has(s.id)) {
        problems.push({ level: 'warning', message: `Part "${s.label}" has no time limit, so a candidate could sit in it indefinitely.` });
      }
    }
  } else if (spec.timing.mode === 'total') {
    const planned = spec.sections.reduce((n, s) => n + (Number(s.recommendedMin) || 0), 0);
    const total = Math.round(spec.durationSec / 60);
    if (planned && total && Math.abs(planned - total) > Math.max(5, total * 0.15)) {
      problems.push({ level: 'warning', message: `The parts add up to ${planned} minutes but the test is ${total}. The progress bar and the clock will tell different stories.` });
    }
  }

  if (spec.navigation.edit) {
    problems.push({ level: 'warning', message: 'Candidates can change answers they already submitted. That is a deliberate setting, but it changes what this test measures.' });
  }

  problems.sort((a, b) => (a.level === b.level ? 0 : a.level === 'error' ? -1 : 1));
  return problems;
}

function drawProblems(root, problems) {
  if (!problems.length) return root.append(el('p', { class: 'allgood', text: 'No problems. Every route resolves and every question has text.' }));
  for (const p of problems) {
    root.append(el('div', { class: `prob ${p.level}` },
      el('span', { class: 'lvl', text: p.level }),
      el('span', { text: p.message })));
  }
}

/* ------------------------------------------------------------------- review -------- */

function specJson() {
  return JSON.stringify({
    durationSec: spec.durationSec,
    notes: spec.notes || '',
    intro: spec.intro || {},
    outro: spec.outro || {},
    timing: spec.timing,
    navigation: spec.navigation,
    integrity: spec.integrity,
    sections: spec.sections,
    briefs: spec.briefs,
    questions: spec.questions,
  }, null, 2);
}

function drawReview(stage) {
  const page = el('div', { class: 'page narrow' });
  const problems = review();
  const errors = problems.filter((p) => p.level === 'error');

  page.append(el('div', { class: 'hero' },
    el('div', { class: 'eyebrow', text: 'Step 3' }),
    el('h1', {}, el('span', { text: 'Check it, try it, ' }), el('b', { text: 'then ship it.' }))));

  const summary = el('section', { class: 'block' }, el('h2', { text: 'What you have built' }));
  const { routes } = routesFrom(spec.questions.length ? spec.questions[0].id : null, spec.questions, []);
  const lengths = routes.map((r) => r.length);
  const lines = [
    `${spec.questions.length} question${spec.questions.length === 1 ? '' : 's'} across ${spec.sections.length} part${spec.sections.length === 1 ? '' : 's'}.`,
    routes.length === 1 ? 'One route through it.' : routeSummary(routes.length, lengths),
    spec.timing.mode === 'none' ? 'Untimed.'
      : spec.timing.mode === 'section' ? 'A clock for each part.'
      : `One clock, ${Math.round(spec.durationSec / 60)} minutes.`,
    spec.navigation.edit ? 'Candidates can go back and change their answers.'
      : spec.navigation.back ? 'Candidates can look back but not change anything.'
      : 'One question at a time, no going back.',
    spec.integrity.blockPaste ? 'Pasting is blocked.' : 'Pasting is allowed.',
  ];
  const ul = el('ul');
  for (const l of lines) ul.append(el('li', { text: l }));
  summary.append(ul);
  page.append(summary);

  const probs = el('section', { class: 'block' }, el('h2', { text: errors.length ? `${errors.length} problem${errors.length === 1 ? '' : 's'} to fix` : 'Problems' }));
  drawProblems(probs, problems);
  page.append(probs);

  const ship = el('section', { class: 'block ship' },
    el('h2', { text: 'Try it, then ship it' }),
    el('p', { class: 'lede', text: 'Download the spec, then run it against the real engine. Everything works exactly as it will for a candidate, including the clock and the branching.' }),
    el('code', { text: 'node tools/dev-server.mjs --spec=work-test-spec.json' }),
    el('p', { class: 'lede', style: 'margin-top:0.8rem', text: 'When it is right, an engineer turns it into the committed questions file and reads the diff before it goes anywhere near a candidate:' }),
    el('code', { text: 'node tools/spec-apply.mjs work-test-spec.json' }),
    el('code', { text: 'git diff' }),
    el('div', { class: 'callout info', style: 'margin-top:0.9rem' },
      el('strong', { text: 'This page cannot publish. ' }),
      el('span', { text: 'It has no password, and what it would be publishing is a live hiring assessment. Shipping is a reviewed commit on purpose.' })));
  page.append(ship);

  const jsonBox = el('section', { class: 'block' }, el('h2', { text: 'The spec file' }));
  const ta = el('textarea', { class: 'json', spellcheck: 'false' });
  ta.value = specJson();
  ta.readOnly = true;
  jsonBox.append(ta);
  jsonBox.append(el('div', { class: 'btns', style: 'margin-top:0.5rem' },
    el('button', {
      class: 'btn', text: 'Copy',
      onclick: async () => {
        try { await navigator.clipboard.writeText(specJson()); note('Spec copied'); }
        catch { ta.select(); note('Press Ctrl+C to copy'); }
      },
    }),
    el('button', { class: 'btn primary', text: 'Download spec', onclick: download })));
  page.append(jsonBox);

  stage.append(page);
}

/* ------------------------------------------------------------------- files --------- */

function download() {
  const blob = new Blob([specJson()], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: 'work-test-spec.json' });
  document.body.append(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  note('Spec downloaded');
}

function adopt(next) {
  if (!next || !Array.isArray(next.questions)) throw new Error('That file has no questions array.');
  spec = migrate({ ...STARTER(), ...next });
  selected = firstId();
  walk = [];
  draw();
}

$('#import').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try { adopt(JSON.parse(await file.text())); note(`Loaded ${file.name}`); }
  catch (err) { note(`Could not read that file: ${err.message}`, true); }
  e.target.value = '';
});

$('#load-example').addEventListener('click', async () => {
  if (!confirm('Replace the current draft with the example? Anything unsaved here is lost.')) return;
  for (const path of ['tools/evp-spec.json', 'tools/example-branching-spec.json']) {
    try {
      const res = await fetch(path);
      if (!res.ok) continue;
      adopt(await res.json());
      return note(`Loaded ${path}`);
    } catch { /* try the next one */ }
  }
  note('Could not load an example. Are you running the dev server?', true);
});

$('#download').addEventListener('click', download);
addEventListener('resize', () => { if (step === 'questions' && tab === 'map') drawInspector(); });

draw();
</script>
</body>
</html>
