<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Evidence Action EVP Work Test</title>
<link rel="stylesheet" href="assets/styles.css">
<script src="assets/theme.js"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f5f4f'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23fff' stroke-width='2.2'/%3E%3Cpath d='M16 10.5V16l3.6 2.6' stroke='%23fff' stroke-width='2.2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
</head>
<body>
<main id="app" class="wrap">
  <p class="muted" id="boot">Loading&hellip;</p>
</main>

<!-- Screens are cloned from these templates and filled in by assets/app.js from the server's
     response. Nothing belonging to a later question is ever in the live DOM, and nothing in these
     templates states a rule of the test: rules about time, going back and files are written by the
     engine that enforces them, so this page cannot promise something the test does not do. -->

<template id="tpl-invalid">
  <section class="card">
    <h1>This link is not valid</h1>
    <p>The link may have been mistyped, or it may have been withdrawn. Reply to the email you received and we will send a fresh one.</p>
    <p class="muted">If you were part-way through, do not start again from a new link. Reply to the email that sent you this link and tell us what happened.</p>
  </section>
</template>

<template id="tpl-offline">
  <section class="card">
    <h1>We cannot reach the server</h1>
    <p data-hook="detail">Either this device has lost its connection, or our end is briefly unavailable.</p>
    <p>Nothing you have already submitted is affected. If your task is timed, the clock is held on our server rather than in this page, so reconnecting does not cost you anything beyond the time itself.</p>
    <p class="muted">Try again in a moment. Do not open a new link or start over: it will not give you more time, and this session is the one we will read.</p>
    <footer class="bar bottom">
      <span class="muted small">Nothing is submitted from this screen.</span>
      <button class="primary" data-hook="retry">Try again</button>
    </footer>
  </section>
</template>

<template id="tpl-identify">
  <section class="card">
    <p class="eyebrow">Evidence Action &middot; Executive Vice President, Evidence</p>
    <h1>Take-home exercise</h1>
    <p>Enter your name and the email address you applied with, so we can match this to your application.</p>
    <div class="stack">
      <label class="lbl" for="cand-name">Full name</label>
      <input id="cand-name" type="text" autocomplete="name" spellcheck="false">
      <label class="lbl" for="cand-email">Email address</label>
      <input id="cand-email" type="email" autocomplete="email" spellcheck="false">
    </div>
    <p class="err" data-hook="err" hidden></p>
    <footer class="bar bottom">
      <span class="muted small" data-hook="startnote">Nothing has started yet.</span>
      <button class="primary" data-hook="go">Continue</button>
    </footer>
  </section>
</template>

<template id="tpl-instructions">
  <section class="card">
    <p class="eyebrow">Candidate instructions</p>
    <h1 data-hook="greeting">Before you start</h1>
    <p data-hook="summary"></p>
    <p data-hook="blurb" hidden></p>

    <!-- The three things a candidate most wants to know, written by the engine from the settings
         (time, structure, format) so they cannot disagree with the rules below. -->
    <div class="glance" data-hook="glance" hidden></div>

    <div class="track" data-hook="track" aria-hidden="true"></div>
    <p class="track-note muted small" data-hook="tracknote"></p>

    <ul class="rules" data-hook="rules"></ul>
    <div data-hook="prose"></div>
    <p class="muted small" data-hook="closing" hidden></p>
    <p class="err" data-hook="err" hidden></p>

    <footer class="bar bottom">
      <span class="muted small" data-hook="who"></span>
      <button class="primary" data-hook="begin">I understand, begin</button>
    </footer>
  </section>
</template>

<template id="tpl-question">
  <section class="card">
    <header class="bar">
      <span class="progress"><span data-hook="section"></span><span data-hook="progress"></span></span>
      <span class="clock-wrap">
        <span class="clock-label muted small" data-hook="clocklabel"></span>
        <span class="clock" data-hook="clock" role="timer" aria-live="off">&mdash;</span>
      </span>
    </header>
    <div class="track" data-hook="track" aria-hidden="true"></div>
    <p class="track-note muted small" data-hook="tracknote"></p>

    <aside class="brief" data-hook="brief" hidden></aside>

    <h1 class="prompt" data-hook="prompt"></h1>
    <p class="context muted" data-hook="context" hidden></p>
    <div data-hook="field"></div>
    <p class="err" data-hook="err" hidden></p>
    <footer class="bar bottom">
      <div class="actions" data-hook="actions"></div>
      <div class="commit">
        <span class="muted small" data-hook="finality"></span>
        <button class="primary" data-hook="next"></button>
      </div>
    </footer>
  </section>
</template>

<template id="tpl-done">
  <section class="card">
    <h1 data-hook="title">Submitted</h1>
    <p data-hook="body"></p>
    <p class="muted" data-hook="note"></p>
    <p class="muted small" data-hook="closing" hidden></p>
    <p class="err" data-hook="err" hidden></p>
    <div class="actions" data-hook="actions"></div>
    <div class="testing-only" data-hook="resetbox" hidden>
      <p><strong>Internal testing</strong>. This box is only here because <code>ALLOW_SELF_RESET</code> is switched on. Candidates must never see it, so turn that variable off before sending this to anyone outside the team.</p>
      <button class="ghost-btn" data-hook="reset">Wipe this session and start over</button>
    </div>
  </section>
</template>

<script src="assets/app.js"></script>
</body>
</html>
